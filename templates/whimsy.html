<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whimsy — Your Personal Music App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/whimsy.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <!-- Brand Box -->
            <div class="sidebar-box">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                        </svg>
                    </div>
                    <span class="brand-name">Whimsy</span>
                </div>

                <ul class="nav-list">
                    <li class="nav-item active">
                        <a href="#">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                            </svg>
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            Search
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Library Box -->
            <div class="sidebar-box library-box">
                <div class="library-header">
                    <div class="library-title">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
                        </svg>
                        <span>Your Library</span>
                    </div>
                </div>

                <div class="library-items" id="library-playlists">
                    <div class="library-item">
                        <div class="library-thumb" style="background: linear-gradient(135deg, #1DB954, #121212); display: flex; align-items: center; justify-content: center;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </div>
                        <div class="library-info">
                            <span class="library-name">Liked Songs</span>
                            <span class="library-sub">Playlist • Local Library</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Display Window -->
        <main class="main-view">
            <!-- Top Navigation Bar -->
            <header class="top-bar">
                <div class="url-importer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <input type="text" id="spotify-url-input" placeholder="Paste Spotify playlist link here to download & play...">
                    <button id="import-btn" onclick="fetchWhimsyPlaylist()">Fetch</button>
                </div>
            </header>

            <!-- Main Content Area -->
            <div class="view-content" id="view-content">
                <!-- Dynamic Playlist Header injected by JS -->
                <div class="playlist-banner" id="banner-container">
                    <img src="https://i.scdn.co/image/ab67706f0000000277c25630aff0901ed026d2d4" alt="" class="banner-cover" id="banner-img">
                    <div class="banner-details">
                        <span style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; color: var(--primary-bright);">PLAYLIST</span>
                        <h1 id="banner-title">Welcome to Whimsy</h1>
                        <p class="banner-meta" id="banner-meta">Paste a Spotify playlist link above to load your music library</p>
                        <div class="action-bar">
                            <button class="play-all-btn" onclick="playCurrentQueue()">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </button>
                            <button class="download-all-btn" id="whimsy-download-btn" onclick="startWhimsyDownload()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="7 10 12 15 17 10"/>
                                    <line x1="12" y1="15" x2="12" y2="3"/>
                                </svg>
                                <span>Download Playlist</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Track Table View -->
                <div class="track-table">
                    <div class="table-header">
                        <span class="col-num">#</span>
                        <span class="col-title">Title</span>
                        <span class="col-album">Album</span>
                        <span class="col-duration">Duration</span>
                    </div>

                    <div id="whimsy-track-list">
                        <!-- Tracks dynamically loaded -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Now Playing Bar -->
    <footer class="player-bar">
        <div class="player-left">
            <img src="https://i.scdn.co/image/ab67706f0000000277c25630aff0901ed026d2d4" alt="" class="player-cover" id="player-thumb">
            <div class="player-track-info">
                <span class="player-title" id="player-title">Select a track</span>
                <span class="player-artist" id="player-artist">Whimsy Music Player</span>
            </div>
        </div>

        <div class="player-center">
            <div class="controls">
                <button class="control-btn" title="Shuffle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
                    </svg>
                </button>
                <button class="control-btn" title="Previous">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="play-pause-btn" id="main-play-btn" onclick="toggleAudioPlay()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="play-icon">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button class="control-btn" title="Next">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

            <div class="seek-bar-wrapper">
                <span class="time-stamp" id="curr-time">0:00</span>
                <div class="seek-bar" id="seek-bar">
                    <div class="seek-fill" id="seek-fill"></div>
                </div>
                <span class="time-stamp" id="total-time">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <!-- Hidden Audio Element for Browser Playback -->
            <audio id="audio-engine"></audio>
        </div>
    </footer>

    <script src="/static/js/whimsy.js"></script>
</body>
</html>
